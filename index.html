<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDS124BR Teaching Portfolio | Kreshiv Chawla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   EDIT ONLY THIS BLOCK.
   ---------------------------------------------------------------------
   Each week is a column. Each video is a card with:
     title:   big text at the top of the card   (e.g. "Sequencing:")
     youtube: paste ANY YouTube link between the quotes
     caption: small text under the video        (e.g. "Sequencing Program Demo")

   Add a video:  copy one { title..., youtube..., caption... }, paste it
                 inside the same week, and change the text.
                 Separate cards with a comma.
   Add a week:   copy a whole { week: ..., videos: [ ... ] } block.
   ===================================================================== */
const PORTFOLIO = {
  title: "EDS124BR Teaching Portfolio",
  author: "Kreshiv Chawla",

  weeks: [
    {
      week: "Week 1 Videos",
      videos: [
        { title: "Sequencing:", youtube: "", caption: "Sequencing Program Demo" }
      ]
    },
    {
      week: "Week 2 Videos",
      videos: [
        { title: "Repeats:",     youtube: "", caption: "Repeats Video" },
        { title: "Lesson Plan:", youtube: "", caption: "Lesson Plan" }
      ]
    },
    {
      week: "Week 3 Videos",
      videos: [
        { title: "Events:",         youtube: "", caption: "Events Program" },
        { title: "Nested Repeats:", youtube: "", caption: "Nested Repeats" }
      ]
    },
    {
      week: "Week 4 Videos",
      videos: [
        { title: "Variables:", youtube: "", caption: "Variables Program" }
      ]
    }
  ]
};
</script>

<style>
  :root {
    --bg: #8f877c;
    --bg-2: #a59d91;
    --head: #5b4f40;
    --head-ink: #ffffff;
    --card: #ffffff;
    --ink: #1c1c1c;
    --muted: #5f5f5f;
    --empty: #ece8e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% 0%, var(--bg-2), transparent 60%),
      radial-gradient(900px 700px at 90% 100%, #7b7368, transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  .top { max-width: 1400px; margin: 0 auto; padding: 48px 24px 28px; color: #fff; }
  .by { font-size: 15px; opacity: .9; margin-bottom: 6px; }
  h1 {
    margin: 0; font-weight: 800; letter-spacing: -.01em;
    font-size: clamp(26px, 4vw, 36px);
    text-shadow: 0 1px 2px rgba(0,0,0,.15);
  }

  .board {
    max-width: 1400px; margin: 0 auto; padding: 8px 24px 64px;
    display: grid; gap: 28px; align-items: start;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  }
  .col { display: flex; flex-direction: column; gap: 18px; }
  .col-head {
    background: var(--head); color: var(--head-ink);
    font-weight: 800; font-size: 24px;
    padding: 12px 16px; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }

  .card {
    background: var(--card); border-radius: 16px; padding: 14px 12px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .card h3 { margin: 0 4px 10px; font-size: 21px; font-weight: 700; }
  .card .cap { margin: 10px 4px 0; color: var(--muted); font-size: 15px; }

  .video {
    position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    background: #111; cursor: pointer; border: 0; padding: 0; width: 100%; display: block;
  }
  .video img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(0,0,0,.65); display: grid; place-items: center;
    transition: transform .15s ease, background .15s ease;
  }
  .play::after {
    content: ""; margin-left: 4px;
    border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
  }
  .video:hover .play { transform: translate(-50%, -50%) scale(1.08); background: rgba(0,0,0,.8); }
  .tag {
    position: absolute; left: 0; bottom: 0;
    background: #fff; color: var(--ink); font-size: 14px; font-weight: 500;
    padding: 5px 14px 4px 12px; border-top-right-radius: 14px;
  }
  .empty {
    aspect-ratio: 16 / 9; border-radius: 10px; background: var(--empty);
    display: grid; place-items: center; color: var(--muted); font-size: 14px;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="by" id="by"></div>
    <h1 id="title"></h1>
  </div>
  <main class="board" id="board"></main>

<script>
  // Pulls the video id out of any YouTube link (watch, youtu.be, shorts, embed, or a bare id).
  function parseYouTube(url) {
    if (!url) return null;
    url = url.trim();
    if (/^[\w-]{11}$/.test(url)) return { id: url, start: 0 };
    try {
      const u = new URL(url);
      const host = u.hostname.replace(/^(www|m)\./, "");
      let id = null;
      if (host === "youtu.be") id = u.pathname.slice(1, 12);
      else if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
        id = u.searchParams.get("v");
        if (!id) {
          const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/);
          if (m) id = m[2];
        }
      }
      if (!id) return null;
      let start = 0;
      const t = u.searchParams.get("t") || u.searchParams.get("start");
      if (t) {
        const p = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?/);
        start = (+p[1] || 0) * 3600 + (+p[2] || 0) * 60 + (+p[3] || 0);
      }
      return { id, start };
    } catch (e) { return null; }
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  // Shows a thumbnail first (fast, Padlet-style); swaps in the real player on click.
  function videoBlock(v) {
    const yt = parseYouTube(v.youtube);
    if (!yt) return el("div", "empty", "Video coming soon");

    const btn = el("button", "video");
    btn.type = "button";
    btn.setAttribute("aria-label", "Play " + (v.caption || v.title || "video"));
    const img = el("img");
    img.alt = "";
    img.loading = "lazy";
    img.onerror = () => { img.style.visibility = "hidden"; };
    img.src = "https://i.ytimg.com/vi/" + yt.id + "/hqdefault.jpg";
    btn.append(img, el("span", "play"), el("span", "tag", "YouTube"));

    btn.addEventListener("click", () => {
      const f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + yt.id + "?autoplay=1&rel=0" + (yt.start ? "&start=" + yt.start : "");
      f.title = v.caption || v.title || "YouTube video";
      f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      f.allowFullscreen = true;
      f.referrerPolicy = "strict-origin-when-cross-origin";
      btn.replaceChildren(f);
      btn.style.cursor = "default";
    }, { once: true });
    return btn;
  }

  const P = PORTFOLIO;
  document.title = P.title + " | " + P.author;
  document.getElementById("title").textContent = P.title;
  document.getElementById("by").textContent = P.author;

  const board = document.getElementById("board");
  P.weeks.forEach(w => {
    const col = el("section", "col");
    col.appendChild(el("div", "col-head", w.week));
    (w.videos || []).forEach(v => {
      const card = el("article", "card");
      if (v.title) card.appendChild(el("h3", "", v.title));
      card.appendChild(videoBlock(v));
      if (v.caption) card.appendChild(el("p", "cap", v.caption));
      col.appendChild(card);
    });
    board.appendChild(col);
  });
</script>
</body>
</html>
