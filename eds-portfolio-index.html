<style>
  :root {

    --accent: #2f5d62;
    --accent-ink: #ffffff;

  }
  @media (prefers-color-scheme: dark) {

      --muted: #a3aeb0;

<body>
  <header class="site">
    <div class="bar">

      <nav class="links" id="nav"></nav>

  </header>

  <div class="hero" id="top">
    <span class="eyebrow" id="tagline"></span>
    <h1 id="name"></h1>
    <p id="about"></p>
  </div>

  <main id="content"></main>

  <footer><div class="bar" id="foot"></div></footer>

<script>
  // Turns any YouTube link (or a bare 11-char id) into an embed URL.
  function youtubeEmbed(url) {
    if (!url) return null;
    url = url.trim();
    let id = null, start = 0;
    if (/^[\w-]{11}$/.test(url)) id = url;
    try {
      const u = new URL(url);
      const host = u.hostname.replace(/^www\.|^m\./, "");
      if (host === "youtu.be") id = u.pathname.slice(1, 12);
      else if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
        if (u.searchParams.get("v")) id = u.searchParams.get("v");
        else {
          const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/);
          if (m) id = m[2];
        }
      }
      const t = u.searchParams.get("t") || u.searchParams.get("start");
      if (t) {
        const parts = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?/);
        start = (+parts[1] || 0) * 3600 + (+parts[2] || 0) * 60 + (+parts[3] || 0);
      }
    } catch (e) { /* not a URL, maybe a bare id */ }
    if (!id) return null;
    return "https://www.youtube-nocookie.com/embed/" + id + "?rel=0" + (start ? "&start=" + start : "");
  }

  function el(tag, attrs = {}, text) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text) n.textContent = text;
    return n;
  }

  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }

  const P = PORTFOLIO;
  document.title = P.tagline + " | " + P.name;
  document.getElementById("brand").textContent = P.name;
  document.getElementById("tagline").textContent = P.tagline;
  document.getElementById("name").textContent = P.name;
  document.getElementById("about").textContent = P.about;
  document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + P.name;

  const nav = document.getElementById("nav");
  const content = document.getElementById("content");

  P.sections.forEach(sec => {
    const id = slug(sec.section);
    nav.appendChild(el("a", { href: "#" + id }, sec.section));

    const block = el("section", { class: "block", id });
    block.appendChild(el("h2", {}, sec.section));
    if (sec.intro) block.appendChild(el("p", { class: "section-intro" }, sec.intro));

    const grid = el("div", { class: "grid" });
    (sec.items || []).forEach(item => {
      const card = el("article", { class: "card" });
      const src = youtubeEmbed(item.youtube) || (item.embed ? item.embed.trim() : null);
      const hasMediaField = "youtube" in item || "embed" in item;

      if (src) {
        const media = el("div", { class: "media" });
        media.appendChild(el("iframe", {
          src, title: item.title || "Embedded content", loading: "lazy",
          allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share",
          allowfullscreen: "", referrerpolicy: "strict-origin-when-cross-origin"
        }));
        card.appendChild(media);
      } else if (hasMediaField) {
        card.appendChild(el("div", { class: "media empty" }, "Video coming soon"));
      }

      const body = el("div", { class: "body" });
      if (item.title) body.appendChild(el("h3", {}, item.title));
      if (item.text) body.appendChild(el("p", {}, item.text));
      if (item.link) {
        body.appendChild(el("a", { class: "btn", href: item.link, target: "_blank", rel: "noopener" },
          item.linkLabel || "Open"));
      }
      card.appendChild(body);
      grid.appendChild(card);
    });
    block.appendChild(grid);
    content.appendChild(block);
  });
</script>
